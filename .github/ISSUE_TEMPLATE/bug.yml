name: Bug report
description: Something in the SDK does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SDK version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Remove API keys, webhook secrets and phone numbers before pasting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
