[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "larynth"
version = "0.1.0"
description = "Official Python SDK for the Larynth voice AI API and webhook signature verification"
readme = "README.md"
keywords = ["larynth", "voice", "ai", "telephony", "sdk", "webhooks"]
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<0.29",
  "attrs>=23.2",
  "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://docs.larynth.com/sdks/python"
Documentation = "https://docs.larynth.com/sdks/python"
Repository = "https://github.com/Larynth-Labs/larynth-python"
Issues = "https://github.com/Larynth-Labs/larynth-python/issues"
Changelog = "https://github.com/Larynth-Labs/larynth-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
larynth = ["py.typed"]
