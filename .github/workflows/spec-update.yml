name: spec-update

on:
  push:
    branches:
      - "spec/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: make generate
      - name: commit regenerated code
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "generated code already current"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(spec): regenerate SDK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "pull request already open for $BRANCH"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore(spec): sync API spec (${BRANCH#spec/})" \
            --body "Synced from the core API spec and regenerated the client. Review the generated diff before merging."
